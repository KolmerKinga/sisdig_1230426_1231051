# =====================================================================
# auth-service - settings shared by both replicas.
# Replica-specific values are in application-instance1/2.properties.
# Every value written as ${ENV_VAR:default} can be overridden by an
# environment variable (e.g. in docker-compose).
# =====================================================================
spring.application.name=auth-service

# ---------------------------------------------------------------- replica
aisafe.instance-id=auth-local
server.port=8051
# auth-service replicas do not forward requests: both hold the same collaborators
aisafe.peers=
# Same seed on every replica (users are replicated reference data)
aisafe.bootstrap.file=classpath:seed/collaborators.json

# ---------------------------------------------------------------- secrets (override in production)
aisafe.service-key=${AISAFE_SERVICE_KEY:dev-service-key-change-me}
# Base64 HMAC key shared with every AISafe service (>= 256 bits). Dev default only.
aisafe.jwt.secret=${AISAFE_JWT_SECRET:ZGV2LW9ubHktYWlzYWZlLWp3dC1zZWNyZXQtY2hhbmdlLW1lLTIwMjYh}
aisafe.jwt.expiration=1h
aisafe.jwt.issuer=aisafe-auth-service

# ---------------------------------------------------------------- brute-force protection
aisafe.login.max-failures=5
aisafe.login.lock-duration=5m

# ---------------------------------------------------------------- HTTPS (TLS)
# Certificates are generated by AISafe/scripts/gen-certs.(sh|bat) into AISafe/certs (not committed).
server.ssl.enabled=true
server.ssl.bundle=aisafe
spring.ssl.bundle.jks.aisafe.key.alias=aisafe
spring.ssl.bundle.jks.aisafe.keystore.location=file:${AISAFE_CERTS_DIR:../certs}/aisafe-keystore.p12
spring.ssl.bundle.jks.aisafe.keystore.password=${AISAFE_KEYSTORE_PASSWORD:changeit}
spring.ssl.bundle.jks.aisafe.keystore.type=PKCS12
spring.ssl.bundle.jks.aisafe.truststore.location=file:${AISAFE_CERTS_DIR:../certs}/aisafe-truststore.p12
spring.ssl.bundle.jks.aisafe.truststore.password=${AISAFE_KEYSTORE_PASSWORD:changeit}
spring.ssl.bundle.jks.aisafe.truststore.type=PKCS12

# ---------------------------------------------------------------- database (one per replica)
spring.datasource.url=jdbc:h2:mem:auth_${server.port};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ---------------------------------------------------------------- errors (never expose internals)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------- monitoring / docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
