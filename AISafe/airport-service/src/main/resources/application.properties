# =====================================================================
# airport-service - settings shared by every replica.
# Replica-specific values are in application-instance1/2.properties.
# Every value written as ${ENV_VAR:default} can be overridden by an
# environment variable (e.g. in docker-compose).
# =====================================================================
spring.application.name=airport-service

# ---------------------------------------------------------------- replica
aisafe.instance-id=airport-local
server.port=8091
# Base URLs of the OTHER replicas (comma separated). Never include this replica.
aisafe.peers=
# Seed data for this replica (empty = start with no airports)
aisafe.bootstrap.file=

# ---------------------------------------------------------------- secrets (override in production)
# Shared with every AISafe service; required on internal calls (X-Service-Key).
aisafe.service-key=${AISAFE_SERVICE_KEY:dev-service-key-change-me}
# Base64 HMAC key shared with auth-service (>= 256 bits). Dev default only.
aisafe.jwt.secret=${AISAFE_JWT_SECRET:ZGV2LW9ubHktYWlzYWZlLWp3dC1zZWNyZXQtY2hhbmdlLW1lLTIwMjYh}

# ---------------------------------------------------------------- peer forwarding
aisafe.forwarding.connect-timeout=1s
aisafe.forwarding.read-timeout=2s
aisafe.forwarding.attempts=2
aisafe.forwarding.backoff=200ms
aisafe.forwarding.peer-down-for=10s

# ---------------------------------------------------------------- HTTPS (TLS)
# Certificates are generated by AISafe/scripts/gen-certs.(sh|bat) into AISafe/certs
# (not committed). The same bundle is used by the server and by the peer HTTP client.
server.ssl.enabled=true
server.ssl.bundle=aisafe
spring.ssl.bundle.jks.aisafe.key.alias=aisafe
spring.ssl.bundle.jks.aisafe.keystore.location=file:${AISAFE_CERTS_DIR:../certs}/aisafe-keystore.p12
spring.ssl.bundle.jks.aisafe.keystore.password=${AISAFE_KEYSTORE_PASSWORD:changeit}
spring.ssl.bundle.jks.aisafe.keystore.type=PKCS12
spring.ssl.bundle.jks.aisafe.truststore.location=file:${AISAFE_CERTS_DIR:../certs}/aisafe-truststore.p12
spring.ssl.bundle.jks.aisafe.truststore.password=${AISAFE_KEYSTORE_PASSWORD:changeit}
spring.ssl.bundle.jks.aisafe.truststore.type=PKCS12

# ---------------------------------------------------------------- database (one per replica)
spring.datasource.url=jdbc:h2:mem:airport_${server.port};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=false

# ---------------------------------------------------------------- errors (never expose internals)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------- uploads (CSV import)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ---------------------------------------------------------------- monitoring / docs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
