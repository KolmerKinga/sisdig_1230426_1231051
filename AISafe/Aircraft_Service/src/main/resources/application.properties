spring.application.name=aircraft-service
spring.datasource.url=jdbc:h2:mem:aircraftdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

aisafe.service-key=secret-service-key
aisafe.jwt-secret=default-secret-key-that-is-at-least-32-bytes-long!
