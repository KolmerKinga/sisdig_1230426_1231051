server.port=8084
spring.application.name=route-flight-service

# Configuração da Instância 2
aisafe.instance-name=route-flight-2
aisafe.seed-file=classpath:seed/routes-flights-instance2.json

# Peers de Comunicação (Aircraft Service + Primeira Instância deste serviço)
aisafe.peers[0].name=aircraft-1
aisafe.peers[0].url=http://localhost:8081

aisafe.peers[1].name=aircraft-2
aisafe.peers[1].url=http://localhost:8082

aisafe.peers[2].name=route-flight-1
aisafe.peers[2].url=http://localhost:8083

# Base de Dados H2 (Instância 2)
spring.datasource.url=jdbc:h2:mem:routeflight_db2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Bypass
spring.security.user.name=admin
spring.security.user.password=admin
