# Nome da Aplicacao
spring.application.name=route-flight-service

# Perfil ativo por omissao
spring.profiles.active=instance1

# Configuração da Base de Dados H2 em Ficheiro Partilhado
spring.datasource.url=jdbc:h2:file:./data/aisafedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações Comuns de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Credenciais de Dev / Security
spring.security.user.name=admin
spring.security.user.password=admin?
